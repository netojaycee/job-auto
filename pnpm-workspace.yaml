packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# msgpackr-extract is an optional native accelerator for BullMQ's msgpackr
# dependency — msgpackr falls back to a pure-JS implementation without it,
# so we explicitly decline to build it rather than approve it.
allowBuilds:
  msgpackr-extract: false
